baseURL: "/"
languageCode: "en-us"
defaultContentLanguage: "en"
title: "Nexus"
theme: "PaperMod"
contentDir: "docs"
publishDir: "public"
enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true

defaultContentLanguageInSubdir: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

pagination:
  pagerSize: 8

taxonomies:
  category: categories
  tag: tags

menu:
  main:
    - identifier: notes
      name: Notes
      url: /notes/
      weight: 10
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

params:
  env: production
  description: "Nexus · A lightweight and focused personal knowledge base."
  author: "Nexus"
  defaultTheme: auto
  disableThemeToggle: false
  disableScrollToTop: false
  mainSections:
    - page
    - notes
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false
  homeInfoParams:
    Title: "Nexus"
    Content: "A quiet, Markdown-powered space for notes, ideas, and learning."
  assets:
    disableHLJS: true
    disableFingerprinting: false
  cover:
    linkFullImages: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys:
      - title
      - permalink
      - summary
      - content
  socialIcons: []
  footer:
    hideCopyright: false
    text: "Keep learning. Keep writing."

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: github
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

minify:
  minifyOutput: true
